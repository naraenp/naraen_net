<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function(){
    var k='theme';
    var v=localStorage.getItem(k);
    if(v===null||v===''){ localStorage.setItem(k,'dark'); v='dark'; }
    if(v==='light') document.documentElement.classList.add('theme-light');
  })();
  </script>
  {%- seo -%}
  {%- comment -%} Sitewide Person JSON-LD, in addition to jekyll-seo-tag. Wired to the ORCID and social profiles used on the home page. {%- endcomment -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Naraen Palanikumar",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "image": "{{ site.url }}{{ site.baseurl }}/assets/images/profile.webp",
    "jobTitle": "Founding Engineer",
    "worksFor": { "@type": "Organization", "name": "Phalaena Automata", "url": "https://phalaena.ai" },
    "sameAs": [
      "https://orcid.org/0000-0001-8513-4590",
      "https://github.com/naraenp",
      "https://www.linkedin.com/in/naraenp/"
    ]
  }
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon-180.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/Switzer-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/Zodiak-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics-ga4.html -%}
  {%- endif -%}
</head>
