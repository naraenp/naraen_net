<script>
(function() {
  // Light is the default; 'dark' is the only value ever stored. head.html
  // already applies the class before first paint, so this only keeps the
  // button label in sync and handles clicks.
  var key = 'theme';
  var root = document.documentElement;

  function apply(theme) {
    root.classList.toggle('theme-dark', theme === 'dark');
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }
  }

  function get() { return localStorage.getItem(key) === 'dark' ? 'dark' : 'light'; }
  function set(theme) { localStorage.setItem(key, theme); apply(theme); }

  apply(get());

  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function() {
      set(get() === 'dark' ? 'light' : 'dark');
    });
  }
})();
</script>
