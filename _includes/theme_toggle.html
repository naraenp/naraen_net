<script>
(function() {
  var key = 'theme';
  var root = document.documentElement;
  function apply(theme) {
    if (theme === 'light') root.classList.add('theme-light');
    else root.classList.remove('theme-light');
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
    }
  }
  function get() { var v=localStorage.getItem(key); return (v==='dark') ? 'dark' : 'light'; }
  function set(theme) { localStorage.setItem(key, theme); apply(theme); }
  apply(get());
  document.getElementById('theme-toggle') && document.getElementById('theme-toggle').addEventListener('click', function() {
    set(get() === 'light' ? 'dark' : 'light');
  });
})();
</script>
