<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#130F11"/>

  <!-- subtle top accent rule -->
  <rect x="80" y="80" width="120" height="1" fill="#967386"/>

  <!-- eyebrow -->
  <text x="80" y="130" font-family="Fragment Mono, monospace" font-size="22" fill="#C2ADB8" letter-spacing="0.5">naraen.net</text>

  <!-- wordmark / display -->
  <text x="80" y="320" font-family="Sentient, Georgia, serif" font-size="120" font-weight="400" letter-spacing="-1.2">
    <tspan fill="#967386">Naraen</tspan>
    <tspan fill="#F0E9EC"> Palanikumar</tspan>
  </text>

  <!-- tagline -->
  <text x="80" y="400" font-family="Plein, Inter, sans-serif" font-size="32" fill="#D7C9D0">Bioinformatics AI engineer and cloud architect.</text>
  <text x="80" y="445" font-family="Plein, Inter, sans-serif" font-size="32" fill="#D7C9D0">Founding engineer at Phalaena Automata.</text>

  <!-- mono footer line -->
  <text x="80" y="550" font-family="Fragment Mono, monospace" font-size="20" fill="#5B4752">/genomics /cloud /applied-ai</text>

  <!-- right-side mauve dot motif -->
  <g transform="translate(1040, 315)">
    <circle r="120" fill="none" stroke="#5B4752" stroke-width="1"/>
    <circle r="80" fill="none" stroke="#5B4752" stroke-width="1"/>
    <circle r="40" fill="#967386"/>
  </g>
</svg>
