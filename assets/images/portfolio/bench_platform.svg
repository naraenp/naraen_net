<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bench platform architecture thumbnail: sequencing inputs feeding an API layer, containerized workflows, and an interpretation step">
  <defs>
    <style>
      .bg { fill: #18150C; }
      .grid-line { stroke: #35281A; stroke-width: 1; }
      .node { fill: none; stroke: #52412E; stroke-width: 1; }
      .node-accent { fill: none; stroke: #D68B5B; stroke-width: 1.5; }
      .fill-dim { fill: #A26C3D; }
      .fill-accent { fill: #D68B5B; }
      .wire { stroke: #52412E; stroke-width: 1; fill: none; }
      .wire-accent { stroke: #D68B5B; stroke-width: 1.5; fill: none; }
      .tick { fill: #B9A591; }
      .node-label { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; fill: #89735C; letter-spacing: 0.04em; }
      .label { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; fill: #D68B5B; letter-spacing: 0.04em; }
      .label-dim { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; fill: #89735C; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect class="bg" width="640" height="360"/>

  <g class="grid-line">
    <line x1="0" y1="90"  x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>

  <!-- heterogeneous sequencing inputs -->
  <g>
    <rect x="40" y="120" width="58" height="18" rx="1.5" class="fill-dim"/>
    <rect x="40" y="146" width="58" height="18" rx="1.5" class="fill-accent"/>
    <rect x="40" y="172" width="58" height="18" rx="1.5" class="fill-dim"/>
    <rect x="40" y="198" width="58" height="18" rx="1.5" class="fill-dim"/>
  </g>
  <text class="node-label" x="40" y="234">inputs</text>

  <!-- ingestion / API layer -->
  <g class="wire">
    <line x1="98" y1="129" x2="140" y2="168"/>
    <line x1="98" y1="155" x2="140" y2="168"/>
    <line x1="98" y1="181" x2="140" y2="172"/>
    <line x1="98" y1="207" x2="140" y2="176"/>
  </g>
  <rect x="140" y="138" width="78" height="64" rx="3" class="node-accent"/>
  <g class="fill-accent">
    <rect x="154" y="156" width="50" height="3" rx="1.5"/>
    <rect x="154" y="164" width="50" height="3" rx="1.5"/>
    <rect x="154" y="172" width="34" height="3" rx="1.5"/>
  </g>
  <text class="node-label" x="140" y="220">api</text>

  <!-- containerized workflow lanes -->
  <g class="wire-accent">
    <path d="M 218 162 L 250 112 L 282 112"/>
    <path d="M 218 170 L 250 170 L 282 170"/>
    <path d="M 218 178 L 250 228 L 282 228"/>
  </g>
  <g>
    <rect x="282" y="94"  width="104" height="36" rx="3" class="node"/>
    <rect x="282" y="152" width="104" height="36" rx="3" class="node"/>
    <rect x="282" y="210" width="104" height="36" rx="3" class="node"/>
  </g>
  <g class="fill-dim">
    <rect x="294" y="108" width="10" height="8" rx="1"/><rect x="308" y="108" width="10" height="8" rx="1"/><rect x="322" y="108" width="10" height="8" rx="1"/>
    <rect x="294" y="166" width="10" height="8" rx="1"/><rect x="308" y="166" width="10" height="8" rx="1"/><rect x="322" y="166" width="10" height="8" rx="1"/>
    <rect x="294" y="224" width="10" height="8" rx="1"/><rect x="308" y="224" width="10" height="8" rx="1"/><rect x="322" y="224" width="10" height="8" rx="1"/>
  </g>
  <text class="node-label" x="282" y="266">containerized workflows</text>

  <!-- convergence into interpretation -->
  <g class="wire">
    <path d="M 386 112 L 418 112 L 418 170 L 448 170"/>
    <path d="M 386 170 L 448 170"/>
    <path d="M 386 228 L 418 228 L 418 170 L 448 170"/>
  </g>
  <rect x="448" y="138" width="78" height="64" rx="3" class="node-accent"/>
  <g class="tick">
    <circle cx="470" cy="158" r="2.5"/>
    <circle cx="487" cy="170" r="2.5"/>
    <circle cx="504" cy="152" r="2.5"/>
    <circle cx="478" cy="184" r="2.5"/>
    <circle cx="500" cy="180" r="2.5"/>
  </g>
  <path class="wire-accent" d="M 470 158 L 487 170 L 504 152 M 487 170 L 478 184 M 487 170 L 500 180"/>
  <text class="node-label" x="448" y="220">interpretation</text>

  <!-- external-link glyph, top right -->
  <g>
    <rect x="556" y="46" width="30" height="30" rx="3" class="node"/>
    <path class="wire-accent" d="M 566 66 L 584 48"/>
    <path class="wire-accent" d="M 574 48 L 584 48 L 584 58"/>
  </g>

  <text class="label" x="40" y="32">bench · omics platform</text>
  <text class="label-dim" x="40" y="345">phalaena automata · external site</text>
</svg>
