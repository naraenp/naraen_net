  bullets:
  - id: spv_1
    tags:
    - pipeline
    - nextflow
    - spatial
    - single-cell
    text: Nine-stage Nextflow DSL2 pipeline mapping cell types into tissue space from a 10x Visium breast-cancer
      section (3,798 spots) against a 100,064-cell annotated scRNA-seq reference, covering QC, shared-gene-space
      normalization, signature construction, per-spot deconvolution, and spatially variable genes.
  - id: spv_2
    tags:
    - comp-bio
    - stats
    - spatial
    text: Implemented per-spot deconvolution as non-negative least squares with inverse-mean gene weighting
      to keep the fit from collapsing onto high-expression immune signatures under cross-platform reference
      shift, recovering the expected tumor composition with cancer epithelium leading in 2,201 of 3,798
      spots.
  - id: spv_3
    tags:
    - comp-bio
    - stats
    - spatial
    text: Computed spatially variable genes by a from-first-principles Moran's I on a symmetric kNN spot
      graph, vectorized across genes with a seeded permutation test, identifying 949 significant genes
      that resolve into epithelial, stromal, and immune compartments.
  - id: spv_4
    tags:
    - reproducibility
    - rse
    - testing
    text: Validated with an offline demo mode that synthesizes a toy section with planted spatial cell-type
      proportions and self-checks recovery to 0.008 mean absolute error against known truth.
