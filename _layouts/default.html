<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body class="site-body">
    <div class="ascii-backdrop" id="ascii-backdrop" aria-hidden="true" data-pagefind-ignore></div>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content"{% unless page.url == "/search/" %} data-pagefind-body{% endunless %}>
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    {%- include theme_toggle.html -%}

    <script>
    (function() {
      var host = document.getElementById('ascii-backdrop');
      if (!host) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var variants = [
        // existing 1 — small-slant
        "                             _                                      _\n _ _  __ _ _ _ __ _ ___ _ _ ( )___  _ __  ___ _ _ ___ ___ _ _  __ _| |\n| ' \\/ _` | '_/ _` / -_) ' \\|/(_-< | '_ \\/ -_) '_(_-</ _ \\ ' \\/ _` | |\n|_||_\\__,_|_| \\__,_\\___|_||_| /__/ | .__/\\___|_| /__/\\___/_||_\\__,_|_|\n                                   |_|\n            _       _ _\n__ __ _____| |__ __(_) |_ ___\n\\ V  V / -_) '_ (_-< |  _/ -_)\n \\_/\\_/\\___|_.__/__/_|\\__\\___|",
        // existing 2 — cybermedium
        "_  _ ____ ____ ____ ____ _  _ . ____\n|\\ | |__| |__/ |__| |___ |\\ | ' [__\n| \\| |  | |  \\ |  | |___ | \\|   ___]\n\n___  ____ ____ ____ ____ _  _ ____ _       _ _ _ ____ ___  ____ _ ___ ____\n|__] |___ |__/ [__  |  | |\\ | |__| |       | | | |___ |__] [__  |  |  |___\n|    |___ |  \\ ___] |__| | \\| |  | |___    |_|_| |___ |__] ___] |  |  |___",
        // existing 3 — chunky
        "                                     __\n.-----.---.-.----.---.-.-----.-----.|  |.-----.\n|     |  _  |   _|  _  |  -__|     | |_||__ --|\n|__|__|___._|__| |___._|_____|__|__|    |_____|\n\n                                           __\n.-----.-----.----.-----.-----.-----.---.-.|  |\n|  _  |  -__|   _|__ --|  _  |     |  _  ||  |\n|   __|_____|__| |_____|_____|__|__|___._||__|\n|__|\n                 __           __ __\n.--.--.--.-----.|  |--.-----.|__|  |_.-----.\n|  |  |  |  -__||  _  |__ --||  |   _|  -__|\n|________|_____||_____|_____||__|____|_____|",
        // new — standard
        " _   _                            _\n| \\ | | __ _ _ __ __ _  ___ _ __ ( )___\n|  \\| |/ _` | '__/ _` |/ _ \\ '_ \\|// __|\n| |\\  | (_| | | | (_| |  __/ | | | \\__ \\\n|_| \\_|\\__,_|_|  \\__,_|\\___|_| |_| |___/\n ____                                 _  __        __   _         _ _\n|  _ \\ ___ _ __ ___  ___  _ __   __ _| | \\ \\      / /__| |__  ___(_) |_ ___\n| |_) / _ \\ '__/ __|/ _ \\| '_ \\ / _` | |  \\ \\ /\\ / / _ \\ '_ \\/ __| | __/ _ \\\n|  __/  __/ |  \\__ \\ (_) | | | | (_| | |   \\ V  V /  __/ |_) \\__ \\ | ||  __/\n|_|   \\___|_|  |___/\\___/|_| |_|\\__,_|_|    \\_/\\_/ \\___|_.__/|___/_|\\__\\___|",
        // new — banner3
        "##    ##    ###    ########     ###    ######## ##    ## ####  ######\n###   ##   ## ##   ##     ##   ## ##   ##       ###   ## #### ##    ##\n####  ##  ##   ##  ##     ##  ##   ##  ##       ####  ##  ##  ##\n## ## ## ##     ## ########  ##     ## ######   ## ## ## ##    ######\n##  #### ######### ##   ##   ######### ##       ##  ####            ##\n##   ### ##     ## ##    ##  ##     ## ##       ##   ###      ##    ##\n##    ## ##     ## ##     ## ##     ## ######## ##    ##       ######\n########  ######## ########   ######   #######  ##    ##    ###    ##\n##     ## ##       ##     ## ##    ## ##     ## ###   ##   ## ##   ##\n##     ## ##       ##     ## ##       ##     ## ####  ##  ##   ##  ##\n########  ######   ########   ######  ##     ## ## ## ## ##     ## ##\n##        ##       ##   ##         ## ##     ## ##  #### ######### ##\n##        ##       ##    ##  ##    ## ##     ## ##   ### ##     ## ##\n##        ######## ##     ##  ######   #######  ##    ## ##     ## ########\n##      ## ######## ########   ######  #### ######## ########\n##  ##  ## ##       ##     ## ##    ##  ##     ##    ##\n##  ##  ## ##       ##     ## ##        ##     ##    ##\n##  ##  ## ######   ########   ######   ##     ##    ######\n##  ##  ## ##       ##     ##       ##  ##     ##    ##\n##  ##  ## ##       ##     ## ##    ##  ##     ##    ##\n ###  ###  ######## ########   ######  ####    ##    ########",
        // new — ogre
        "     __                          _\n  /\\ \\ \\__ _ _ __ __ _  ___ _ __( )__\n /  \\/ / _` | '__/ _` |/ _ \\ '_ \\/ __|\n/ /\\  / (_| | | | (_| |  __/ | | \\__ \\\n\\_\\ \\/ \\__,_|_|  \\__,_|\\___|_| |_|___/\n   ___                                _   __    __     _         _ _\n  / _ \\___ _ __ ___  ___  _ __   __ _| | / / /\\ \\ \\___| |__  ___(_) |_ ___\n / /_)/ _ \\ '__/ __|/ _ \\| '_ \\ / _` | | \\ \\/  \\/ / _ \\ '_ \\/ __| | __/ _ \\\n/ ___/  __/ |  \\__ \\ (_) | | | | (_| | |  \\  /\\  /  __/ |_) \\__ \\ | ||  __/\n\\/    \\___|_|  |___/\\___/|_| |_|\\__,_|_|   \\/  \\/ \\___|_.__/|___/_|\\__\\___|",
        // new — doom
        " _   _                            _\n| \\ | |                          ( )\n|  \\| | __ _ _ __ __ _  ___ _ __ |/ ___\n| . ` |/ _` | '__/ _` |/ _ \\ '_ \\  / __|\n| |\\  | (_| | | | (_| |  __/ | | | \\__ \\\n\\_| \\_/\\__,_|_|  \\__,_|\\___|_| |_| |___/\n______                               _   _    _      _         _ _\n| ___ \\                             | | | |  | |    | |       (_) |\n| |_/ /__ _ __ ___  ___  _ __   __ _| | | |  | | ___| |__  ___ _| |_ ___\n|  __/ _ \\ '__/ __|/ _ \\| '_ \\ / _` | | | |/\\| |/ _ \\ '_ \\/ __| | __/ _ \\\n| | |  __/ |  \\__ \\ (_) | | | | (_| | | \\  /\\  /  __/ |_) \\__ \\ | ||  __/\n\\_|  \\___|_|  |___/\\___/|_| |_|\\__,_|_|  \\/  \\/ \\___|_.__/|___/_|\\__\\___|",
        // new — digital
        "+-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+\n|N|a|r|a|e|n|'|s| |P|e|r|s|o|n|a|l| |W|e|b|s|i|t|e|\n+-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+"
      ];

      var isNarrow = window.innerWidth < 640;

      function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

      function spawn() {
        var pre = document.createElement('pre');
        pre.className = 'ascii-art';
        pre.setAttribute('aria-hidden', 'true');
        pre.textContent = pick(variants);

        var baseScale = isNarrow ? 0.38 : 0.55;
        var scale = (baseScale + Math.random() * 0.55).toFixed(2);
        pre.style.fontSize = scale + 'em';

        if (Math.random() < 0.4) pre.style.fontWeight = '700';

        var opacity = (0.12 + Math.random() * 0.10).toFixed(2);
        pre.style.setProperty('--ascii-opacity', opacity);

        pre.style.setProperty('--ascii-top', (Math.random() * 88).toFixed(1) + 'vh');

        var duration = reduce ? 40 : (12 + Math.random() * 18);
        pre.style.setProperty('--ascii-duration', duration.toFixed(1) + 's');

        pre.addEventListener('animationend', function() {
          if (pre.parentNode) pre.parentNode.removeChild(pre);
        });

        host.appendChild(pre);
      }

      var MAX_ON_SCREEN = 7;   // hard cap so a backlog can never pile up at once
      var timer = null;

      function spawnIfRoom() {
        if (host.childElementCount < MAX_ON_SCREEN) spawn();
      }

      function scheduleNext() {
        if (document.hidden) return;   // don't queue spawns while the tab is backgrounded
        var delay = reduce ? 8000 : (1200 + Math.random() * 2400);
        timer = setTimeout(function() {
          spawnIfRoom();
          scheduleNext();
        }, delay);
      }

      function start() {
        if (timer !== null) { clearTimeout(timer); timer = null; }
        scheduleNext();
      }

      // While the tab is hidden, CSS animations pause, so `animationend` never
      // fires and spawned elements are never removed. A timer that kept running
      // would therefore build up a backlog that all appears at once on return.
      // Fix: stop the loop when hidden and restart it (with no backlog) when visible.
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          if (timer !== null) { clearTimeout(timer); timer = null; }
        } else {
          start();
        }
      });

      spawnIfRoom();
      setTimeout(spawnIfRoom, 1400);
      setTimeout(spawnIfRoom, 3200);
      start();
    })();
    </script>
  </body>

</html>
