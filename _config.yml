# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: naraen.net
author:
  name: Naraen Palanikumar
# Email not exposed on site; contact form uses Formspree (set formspree_form_id below).
description: >- # this means to ignore newlines until "baseurl:"
  Naraen Palanikumar. Bioinformatics engineer and cloud architect; founding engineer at Phalaena Automata.
image: /assets/images/og-image.png
formspree_form_id: "xdawzyez" # e.g. "xyzabcde". Create a form at formspree.io and paste the form ID here.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://naraen.net" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  naraenp

# Build settings
# minima's layouts, includes, and styles are vendored in-repo (_layouts/,
# _includes/, _sass/minima*), so the theme gem isn't used. Dropping it also
# avoids pulling in jekyll-feed as a transitive dependency.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  portfolio:
    output: true

# Blog posts ("Log") live under /log/<title>/.
permalink: /log/:title/

# Fixed tag vocabulary for the Log. The /log/ filter only shows chips from this
# list (and only those with at least one post). Keep post tags within this set.
log_tags:
  - paper
  - books
  - meta
  - random

google_analytics: G-C0F7DZGTG0

header_pages:
  - index.markdown  # Main landing page (About, Projects, Experience)
  - cv.markdown

# Exclude from processing.
exclude:
  - README.md
  - CLAUDE.md
