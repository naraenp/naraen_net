        - blockquote [ref=f1e130]:
          - paragraph [ref=f1e131]:
            - strong [ref=f1e132]: "Scope note:"
            - text: the headline metrics are from the offline synthetic cohort, where ground truth is exact. The real GIAB HG002 run is fully wired and the data sources verified (
            - code [ref=f1e133]: fetch_real_data.sh
            - text: ), benchmarked with
            - code [ref=f1e134]: bcftools isec
            - text: against the NIST truth, but the multi-GB-adjacent fetch is run on demand rather than in CI. Filtering is GATK hard-filters rather than VQSR/CNN (which need large cohorts or pretrained models), and somatic calling (Mutect2) is a natural drop-in sibling — both deliberate, documented trade-offs that keep the project laptop-reproducible.
